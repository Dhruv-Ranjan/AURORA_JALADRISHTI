name: Verify release

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python verify_release.py
      - run: python -m pytest remote_training/test_remote_training.py
      - run: python aurora_publication_ready.py --quick
